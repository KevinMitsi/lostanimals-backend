name: Backend CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: ./gradlew --no-daemon test

  release:
    name: Build, publish and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/animales-perdidos' }}
      COMPOSE_SERVICE: ${{ vars.COMPOSE_SERVICE || 'backend' }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://api.animales-perdidos.com/actuator/health' }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY EC2_INSTANCE_ID DEPLOY_PATH COMPOSE_SERVICE HEALTHCHECK_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub production variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify EC2 is connected to Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          ping_status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          if [ "${ping_status}" != "Online" ]; then
            echo "EC2 ${EC2_INSTANCE_ID} is not Online in Systems Manager (status: ${ping_status})." >&2
            exit 1
          fi

      - name: Deploy image on EC2
        id: deploy
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          remote_script="$(cat <<EOF
          set -euo pipefail
          cd '${DEPLOY_PATH}'

          test -f compose.yml || test -f compose.yaml || test -f docker-compose.yml || test -f docker-compose.yaml

          aws ecr get-login-password --region '${AWS_REGION}' \
            | docker login --username AWS --password-stdin '${ECR_REGISTRY}'

          old_container=\$(docker compose ps -q '${COMPOSE_SERVICE}' || true)
          old_image_id=''
          if [ -n "\${old_container}" ]; then
            old_image_id=\$(docker inspect --format '{{.Image}}' "\${old_container}")
          fi

          docker compose pull '${COMPOSE_SERVICE}'
          docker compose stop --timeout 30 '${COMPOSE_SERVICE}'
          docker compose up --detach --no-deps --force-recreate '${COMPOSE_SERVICE}'

          healthy=false
          for _ in \$(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "\${healthy}" != 'true' ]; then
            docker compose logs --no-color --tail 150 '${COMPOSE_SERVICE}' || true
            if [ -n "\${old_image_id}" ]; then
              docker tag "\${old_image_id}" '${image_uri}'
              docker compose up --detach --no-deps --force-recreate '${COMPOSE_SERVICE}'
            fi
            echo 'Deployment health check failed; previous local image was restored when available.' >&2
            exit 1
          fi

          docker image prune --force >/dev/null
          docker compose ps '${COMPOSE_SERVICE}'
          EOF
          )"

          parameters="$(jq -cn --arg script "${remote_script}" '{commands: [$script]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy lostanimals backend ${GITHUB_SHA}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"

          status='Pending'
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

          if [ "${status}" != 'Success' ]; then
            echo "EC2 deployment failed with SSM status: ${status}" >&2
            exit 1
          fi

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "${HEALTHCHECK_URL}"
