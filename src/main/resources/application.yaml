spring:
  application:
    name: animalesperdidos
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/animales_perdidos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/animales_perdidos}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration
  webflux:
    multipart:
      max-in-memory-size: 8MB
    problemdetails:
      enabled: true
  codec:
    max-in-memory-size: 8MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
      issuer: ${JWT_ISSUER:animales-perdidos-colombia}
      ttl: ${JWT_TTL:PT1H}
      refresh-ttl: ${REFRESH_TOKEN_TTL:P30D}
      email-verification-ttl: ${EMAIL_VERIFICATION_TTL:PT24H}
      password-reset-ttl: ${PASSWORD_RESET_TTL:PT30M}
  cloudflare:
    turnstile:
      enabled: ${CLOUDFLARE_TURNSTILE_ENABLED:false}
      secret-key: ${CLOUDFLARE_TURNSTILE_SECRET:}
      expected-hostname: ${CLOUDFLARE_EXPECTED_HOSTNAME:}
      trust-connecting-ip: ${CLOUDFLARE_TRUST_CONNECTING_IP:false}
  storage:
    s3:
      bucket: ${S3_BUCKET:animales-perdidos-dev}
      region: ${AWS_REGION:us-east-1}
  notifications:
    aws:
      enabled: ${AWS_NOTIFICATIONS_ENABLED:false}
      region: ${AWS_REGION:us-east-1}
      queue-url: ${AWS_NOTIFICATION_QUEUE_URL:}
      sender-email: ${AWS_SES_SENDER_EMAIL:}
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
      platform-application-arn: ${AWS_SNS_PLATFORM_APPLICATION_ARN:}
      max-messages: ${AWS_NOTIFICATION_MAX_MESSAGES:10}
      wait-time-seconds: ${AWS_NOTIFICATION_WAIT_SECONDS:20}
      visibility-timeout-seconds: ${AWS_NOTIFICATION_VISIBILITY_SECONDS:60}
      poll-delay-ms: ${AWS_NOTIFICATION_POLL_DELAY_MS:1000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
